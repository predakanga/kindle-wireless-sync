# Release (ADR 0014): on a vX.Y.Z tag, check, test and package, publish a
# GitHub Release with the .kpkg, then ask predakanga/kindle-apps to rebuild
# the shared KPM index (ADR 0024).
#
# Modelled on Kindle Button Mapper's .github/workflows/build-arm.yml
# (armv7-musl build, manifest-at-root check, release asset).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        run: |
          tools/changelog-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md

      - name: Install the Rust target and tools
        run: |
          rustup target add armv7-unknown-linux-musleabihf
          rustup component add clippy rustfmt

      # Zig compiles the bundled SQLite for the Kindle (ADR 0025).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4

      - run: just check
      - run: cargo test
      - run: just package

      - name: Check the package
        run: |
          bin=target/armv7-unknown-linux-musleabihf/release/kindle-wireless-sync
          file "$bin" | grep -q 'ARM.*statically linked' || { echo "::error::not a static ARM binary"; exit 1; }
          if grep -q 'Development commands' "$bin"; then
            echo "::error::the release binary includes dev-tools"
            exit 1
          fi
          size=$(stat -c %s "$bin")
          echo "binary size: $size bytes"
          [ "$size" -lt 5000000 ] || { echo "::error::binary is over 5 MB"; exit 1; }
          tar -tzvf target/package/kindle-wireless-sync.kpkg

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/package/kindle-wireless-sync.kpkg \
            --verify-tag --notes-file notes.md --title "$GITHUB_REF_NAME"

      # A fine-grained token for kindle-apps only, with Actions read and
      # write: it can start the publish workflow but not change any files.
      # Without it the release still stands; the index can be rebuilt by
      # hand from kindle-apps' Actions tab.
      - name: Update the kindle-apps index
        env:
          GH_TOKEN: ${{ secrets.KINDLE_APPS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::KINDLE_APPS_TOKEN isn't set: run kindle-apps' Publish the index workflow by hand"
            exit 0
          fi
          gh workflow run publish.yml -R predakanga/kindle-apps \
            -f repo="$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"
