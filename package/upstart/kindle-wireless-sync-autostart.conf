# Kindle Wireless Sync autostart (ADR 0004): starts the service at boot when
# /var/local/kindle-wireless-sync/autostart exists. Never blocks boot.
start on framework_ready

task
console none

script
    [ -x /var/local/kindle-wireless-sync/autostart.sh ] || exit 0
    exec /var/local/kindle-wireless-sync/autostart.sh
end script
