# Kindle Wireless Sync: receives books from Calibre's wireless device
# connection (ADR 0004). No "start on": it is started by the UI or by
# kindle-wireless-sync-autostart. All logic is in service.sh on writable
# storage, so this file rarely needs to change.
stop on stopping filesystems

respawn
respawn limit 5 60

console none

script
    [ -x /var/local/kindle-wireless-sync/service.sh ] || exit 0
    exec /var/local/kindle-wireless-sync/service.sh
end script
