[package]
name = "kindle-wireless-sync"
version = "0.1.1"
edition = "2021"
description = "Receive books from Calibre's wireless device connection on a Kindle"
license = "GPL-3.0-or-later"

# The library keeps the short name for concise `use kws::...` paths; the
# user- and system-visible binary uses the full name (ADR 0006).
[lib]
name = "kws"
path = "src/lib.rs"

[[bin]]
name = "kindle-wireless-sync"
path = "src/main.rs"

[features]
# Development commands (`discover`, `connect`). Off in packaged builds.
dev-tools = []

[dependencies]
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
sha1_smol = "1"
lexopt = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = "z"
panic = "abort"
codegen-units = 1
