[package]
name = "kws"
version = "0.1.0"
edition = "2021"
description = "Receive books from Calibre's wireless device connection on a Kindle"
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
sha1_smol = "1"
lexopt = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = "z"
panic = "abort"
codegen-units = 1
